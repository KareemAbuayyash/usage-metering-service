services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: usage_metering_v2
      POSTGRES_USER: usage_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usage_app -d usage_metering_v2"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    command: ["node", "scripts/migrate.mjs"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://usage_app:local_dev_password@db:5432/usage_metering_v2
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://usage_app:local_dev_password@db:5432/usage_metering_v2
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  example-client:
    build: .
    command: ["node", "examples/client.mjs"]
    restart: "no"
    environment:
      API_BASE_URL: http://app:3000
    depends_on:
      app:
        condition: service_healthy
volumes:
  postgres_data: